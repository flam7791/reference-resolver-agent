[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "reference-resolver-agent"
version = "0.4.0"
description = "An auditable agent that resolves messy bibliographic references to registered works (DOIs), with confidence thresholds and a human review queue."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Flavio Mericio" }]
keywords = ["ai-agents", "llm", "entity-resolution", "doi", "crossref", "openalex", "mcp", "human-in-the-loop"]
dependencies = [
    "anthropic>=1.0,<2",  # Claude API (optional at runtime: the pipeline also runs without a model)
    "httpx>=0.27,<1",     # scholarly APIs
    "mcp>=2.2,<3",        # exposes the resolver as MCP tools
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "ruff>=0.6"]

[project.scripts]
refresolver = "refresolver.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/refresolver"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
